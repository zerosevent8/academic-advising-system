<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>API Debug Test</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
  button { padding: 15px 20px; font-size: 16px; margin-bottom: 20px; }
  #output { white-space: pre-wrap; word-break: break-all; background: #000; padding: 15px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<h2>Backend Connection Test</h2>
<button onclick="runTest()">Run Test</button>
<div id="output">Tap the button above.</div>

<script>
async function runTest() {
  const out = document.getElementById('output');
  out.textContent = 'Starting test...\n';

  try {
    out.textContent += 'Step 1: Testing basic fetch to root...\n';
    const r1 = await fetch('https://academic-advising-system.onrender.com/');
    const j1 = await r1.json();
    out.textContent += 'Root response: ' + JSON.stringify(j1) + '\n\n';
  } catch (e) {
    out.textContent += 'ROOT FETCH FAILED: ' + e.name + ': ' + e.message + '\n\n';
  }

  try {
    out.textContent += 'Step 2: Testing POST to /api/auth/signup...\n';
    const r2 = await fetch('https://academic-advising-system.onrender.com/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        firstName: 'Test',
        lastName: 'User',
        email: 'debugtest' + Date.now() + '@test.com',
        password: '123456'
      })
    });
    out.textContent += 'Status: ' + r2.status + '\n';
    const j2 = await r2.json();
    out.textContent += 'Response: ' + JSON.stringify(j2) + '\n\n';
    out.textContent += 'SUCCESS! Everything works.';
  } catch (e) {
    out.textContent += 'SIGNUP FETCH FAILED\n';
    out.textContent += 'Error name: ' + e.name + '\n';
    out.textContent += 'Error message: ' + e.message + '\n';
    out.textContent += 'Full error: ' + e.toString();
  }
}
</script>
</body>
</html>
